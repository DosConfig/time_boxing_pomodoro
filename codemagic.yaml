workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: timebox_mark_app_store_connect
    environment:
      flutter: 3.44.4
      xcode: latest
      groups:
        - timebox_mark_ios_release
      vars:
        APP_IDENTIFIER: com.seongwoo.focusmark
        APP_STORE_APPLE_ID: 6792788166
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        FLUTTER_VERSION: 3.44.4
    cache:
      cache_paths:
        - ~/.pub-cache
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: v*.*.*+*
          include: true
    scripts:
      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          echo "PATH=$HOME/.shorebird/bin:$PATH" >> "$CM_ENV"
      - name: Restore ignored Firebase config
        script: |
          bash scripts/ci/restore_firebase_config.sh
      - name: Install Flutter dependencies
        script: |
          flutter pub get
          dart run melos run codegen
          dart pub global activate flutterfire_cli
      - name: Release guardrails
        script: |
          dart run melos run guard
      - name: Set up iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files \
            "$APP_IDENTIFIER" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files \
            "${APP_IDENTIFIER}.PomodoroWidgetExtension" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles \
            --custom-export-options='{"manageAppVersionAndBuildNumber":false}'
      - name: Create Shorebird release IPA
        script: |
          shorebird release ios \
            --flutter-version="$FLUTTER_VERSION" \
            --export-options-plist="${HOME:?}/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-shorebird-patch:
    name: iOS Shorebird Patch
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: timebox_mark_app_store_connect
    environment:
      flutter: 3.44.4
      xcode: latest
      groups:
        - timebox_mark_ios_release
      vars:
        APP_IDENTIFIER: com.seongwoo.focusmark
        FLUTTER_VERSION: 3.44.4
    inputs:
      release_version:
        description: Shorebird release version to patch, for example 1.0.0+4
    scripts:
      - name: Guard Shorebird use
        script: |
          test -f shorebird.yaml || {
            echo "shorebird.yaml is missing. Run shorebird init after App Store/TestFlight setup."
            exit 1
          }
          test -n "$SHOREBIRD_TOKEN" || {
            echo "SHOREBIRD_TOKEN is required."
            exit 1
          }
          test -n "${{ inputs.release_version }}" || {
            echo "release_version input is required."
            exit 1
          }
      - name: Restore ignored Firebase config
        script: |
          bash scripts/ci/restore_firebase_config.sh
      - name: Install Flutter dependencies
        script: |
          flutter pub get
          dart run melos run codegen
      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          echo "PATH=$HOME/.shorebird/bin:$PATH" >> "$CM_ENV"
      - name: Verify patch guardrails
        script: |
          dart run melos run guard
      - name: Set up iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files \
            "$APP_IDENTIFIER" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files \
            "${APP_IDENTIFIER}.PomodoroWidgetExtension" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles \
            --custom-export-options='{"manageAppVersionAndBuildNumber":false}'
      - name: Publish Shorebird iOS patch
        script: |
          shorebird patch ios \
            --release-version="${{ inputs.release_version }}" \
            --flutter-version="$FLUTTER_VERSION" \
            --export-options-plist="${HOME:?}/export_options.plist"
