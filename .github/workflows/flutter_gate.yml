# flutter_gate.yml : CI 게이트. 최종 방어선.
#
# 로컬 훅은 --no-verify로 우회될 수 있지만, 이 워크플로우는 서버에서 실행되므로
# 우회할 수 없다. push와 PR마다 같은 게이트가 다시 돈다.
#
# 설치: 이 파일을 프로젝트의 .github/workflows/flutter_gate.yml 로 복사.
# 브랜치 보호 설정에서 "flutter-gate" 체크 통과를 머지 조건으로 걸면
# 게이트 FAIL 상태로는 머지 자체가 불가능해진다.

name: flutter-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore test-only Firebase placeholders
        run: bash scripts/ci/restore_test_firebase_config.sh

      - name: flutter pub get
        run: flutter pub get

      - name: run gate
        run: bash gates/flutter_check.sh quick
